<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Diamond Life 33</title>
<style>
:root{--bg:#0d1117;--panel:#171d25;--panel2:#10161d;--line:#34404d;--text:#f5f7fa;--muted:#a5b0bc;--gold:#ffd45a;--good:#78df78;--bad:#ff7777;--team:#4169e1;--team2:#dbe4ff}
*{box-sizing:border-box}html,body{margin:0;max-width:100%;overflow-x:hidden;background:var(--bg);color:var(--text)}
body{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;min-height:100vh}
button,input{font:inherit}button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.app{max-width:1050px;margin:auto;padding:9px}.screen{display:none}.screen.on{display:block}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;border:4px solid #000;background:#090d12;padding:9px;margin-bottom:11px;box-shadow:0 0 0 3px var(--team)}
.brand{display:flex;align-items:center;gap:8px}.logo{width:38px;height:38px;border:3px solid #000;background:var(--team);display:flex;align-items:center;justify-content:center;font-weight:900}.brand h1{font-size:16px;margin:0}.build{color:var(--gold);font-size:9px}
.actions{display:flex;gap:5px}.btn{border:3px solid #000;box-shadow:3px 3px 0 #000;background:var(--gold);color:#111;padding:9px 10px;font-weight:900;cursor:pointer}.btn.dark{background:#28313d;color:#fff}.btn.blue{background:var(--team2)}.btn.green{background:var(--good)}.btn.red{background:var(--bad)}
.panel{border:4px solid #000;background:var(--panel);padding:12px;margin-bottom:10px;box-shadow:4px 4px 0 #000;min-width:0}
h2,h3{margin:0 0 8px}.sub,.tiny{color:var(--muted);font-size:10px;line-height:1.55}.tiny{font-size:9px}.chips{display:flex;gap:5px;flex-wrap:wrap}.chip{border:3px solid #000;background:#0d1319;padding:5px 7px;font-size:9px}.chip b{color:var(--gold)}
/* creator */
.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;margin-bottom:8px}.step{border:3px solid #000;background:#111720;padding:6px 3px;text-align:center;font-size:8px;color:var(--muted)}.step.on{background:var(--team);color:#fff;outline:2px solid var(--gold)}
.name{width:100%;border:4px solid #000;background:#0b1016;color:#fff;padding:11px;font-size:17px}.grid2,.grid3{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.grid3{grid-template-columns:repeat(3,minmax(0,1fr))}
.choice{border:4px solid #000;background:#111720;padding:10px;min-height:78px;cursor:pointer}.choice.on{outline:3px solid var(--gold);background:#18263d}.choice b{font-size:11px}.choice small{display:block;color:var(--muted);font-size:8px;margin-top:4px}
.creator-nav{display:grid;grid-template-columns:90px 1fr;gap:7px;margin:9px 0}.team-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}.team-card{border:3px solid #000;background:#111720;padding:8px;min-width:0}.team-card.on{outline:3px solid var(--gold)}
/* season: EVENT FIRST */
.season-head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;margin-bottom:8px}
.event-stage{border:4px solid #000;background:#0c1218;padding:13px;box-shadow:5px 5px 0 #000}
.event-month{font-size:9px;color:var(--gold);font-weight:900;letter-spacing:1px}.event-title{font-size:20px;font-weight:900;line-height:1.25;margin:7px 0}.event-desc{font-size:11px;color:#dae1e8;line-height:1.7}
.event-choices{display:grid;gap:7px;margin-top:11px}.event-choices .btn{width:100%;text-align:left;white-space:normal;line-height:1.35}
.result-box{border:4px solid #000;background:#122018;padding:11px;margin-top:10px;outline:3px solid var(--good)}.result-box.bad{background:#211313;outline-color:var(--bad)}.result-title{font-size:17px;font-weight:900}.result-desc{font-size:10px;color:#dae1e8;line-height:1.6;margin-top:5px}
.effects{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px;margin-top:8px}.effect{border:3px solid #000;background:#090e13;padding:7px}.effect span{display:block;font-size:8px;color:var(--muted)}.effect b{display:block;font-size:15px;margin-top:2px}.effect.up b{color:var(--good)}.effect.down b{color:var(--bad)}
.month-stat{border:3px solid #000;background:#10161d;padding:9px;margin-top:8px}.month-stat strong{font-size:16px;display:block;margin-top:4px}
.month-road{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:3px;margin-top:8px}.month{border:2px solid #000;background:#0d1319;padding:5px 1px;text-align:center;font-size:7px;color:var(--muted)}.month.done{background:#203622;color:#fff}.month.now{background:var(--team);color:#fff;outline:2px solid var(--gold)}
/* data below event */
.data-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}.stat{border:3px solid #000;background:#0d1319;padding:7px;text-align:center}.stat span{font-size:7px;color:var(--muted);display:block}.stat b{font-size:13px;display:block;margin-top:3px}
.attrs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}.attr{border:3px solid #000;background:#0d1319;padding:7px}.attr-top{display:flex;justify-content:space-between;font-size:9px}.bar{height:7px;border:2px solid #000;background:#05080b;margin-top:4px}.fill{height:100%;background:var(--team)}.delta{color:var(--good);font-size:8px;font-weight:900;margin-top:3px}
.log{max-height:230px;overflow:auto}.log-item{border:3px solid #000;border-left:5px solid var(--team);background:#0e141b;padding:7px;margin:5px 0;font-size:9px}
/* draft */
.draft{border:4px solid #000;background:radial-gradient(circle at 50% 15%,#29364a,#0a0e13 60%);padding:14px;min-height:330px}.clock{width:86px;height:86px;border-radius:50%;border:6px solid var(--gold);display:flex;align-items:center;justify-content:center;margin:12px auto;background:#0d1217;font-size:27px;font-weight:900}.draft-msg{text-align:center;font-size:17px;font-weight:900}.draft-sub{text-align:center;font-size:10px;color:var(--muted);margin:5px 0 10px}.roll{display:flex;gap:5px;overflow:hidden}.roll-card{min-width:70px;border:3px solid #000;background:#111720;padding:7px;text-align:center;font-size:8px}.roll-card.hot{background:var(--team);outline:3px solid var(--gold)}
/* tabs */
.tabs{display:flex;gap:5px;flex-wrap:wrap}.tab{border:3px solid #000;background:#111720;color:#fff;padding:7px 9px;font-weight:900}.tab.on{background:var(--team);outline:2px solid var(--gold)}.pane{display:none}.pane.on{display:block}
/* recap */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.82);display:none;align-items:center;justify-content:center;padding:8px;z-index:100}.modal.on{display:flex}.modalbox{width:min(680px,100%);max-height:84dvh;overflow:auto;border:4px solid #000;background:var(--panel);padding:11px;box-shadow:0 0 0 4px var(--team)}
.recap-progress{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin:9px 0}.rstep{border:3px solid #000;background:#111720;padding:6px 2px;text-align:center;font-size:8px}.rstep.on{background:var(--team);outline:2px solid var(--gold)}.rpage{display:none}.rpage.on{display:block}.recap-nav{display:grid;grid-template-columns:1fr 1fr;gap:6px;position:sticky;bottom:0;background:var(--panel);padding-top:8px}
.eval{border:3px solid #000;background:#0d1319;padding:9px;margin:6px 0}.eval-head{display:flex;justify-content:space-between}.grade{font-size:20px;color:var(--gold);font-weight:900}
.honor{border:3px solid #000;background:#151a21;padding:9px;margin:6px 0}.honor.major{outline:3px solid var(--gold)}
@media(max-width:720px){
 .app{padding:7px}.brand h1{font-size:14px}.actions .btn{padding:6px;font-size:8px}.data-grid{grid-template-columns:1fr}.event-title{font-size:18px}.month-road{grid-template-columns:repeat(4,minmax(0,1fr))}.stat-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}.modal{align-items:flex-end}.modalbox{max-height:82dvh;padding-bottom:calc(12px + env(safe-area-inset-bottom))}
}
</style>
</head>
<body>
<div class="app">
<header class="top">
 <div class="brand"><div id="logo" class="logo">DL</div><div><h1>DIAMOND LIFE 33</h1><div class="build">BUILD 33 · EVENT DRIVEN</div></div></div>
 <div class="actions"><button class="btn dark" onclick="openRecords()">기록·수상</button><button class="btn dark" onclick="saveGame()">저장</button><button class="btn dark" onclick="loadGame()">불러오기</button></div>
</header>

<section id="creator" class="screen on">
 <div class="panel"><div id="steps" class="steps"></div><h2 id="ctitle"></h2><div id="csub" class="sub"></div><div class="creator-nav"><button class="btn dark" onclick="prevStep()">이전</button><button id="nextBtn" class="btn green" onclick="nextStep()">다음</button></div><div id="cbody"></div></div>
</section>

<section id="amateur" class="screen">
 <div class="panel">
  <div class="season-head"><div><h2 id="amTitle"></h2><div class="chips"><div class="chip">나이 <b id="amAge"></b></div><div class="chip">단계 <b id="amStage"></b></div><div class="chip">스카우트 <b id="amScout"></b></div></div></div><div class="chip">OVR <b id="amOvr"></b></div></div>
  <div id="amEvent" class="event-stage"></div>
  <div id="amRoad" class="month-road"></div>
 </div>
 <div class="data-grid">
  <div class="panel"><h3>시즌 누적 성적</h3><div id="amStats" class="stat-grid"></div><h3 style="margin-top:10px">능력치</h3><div id="amAttrs" class="attrs"></div></div>
  <div class="panel"><h3>최근 사건</h3><div id="amLog" class="log"></div></div>
 </div>
</section>

<section id="draft" class="screen"><div class="panel"><div class="draft"><div class="tiny" style="text-align:center">PRO BASEBALL ROOKIE DRAFT</div><div id="draftClock" class="clock">10</div><div id="draftMsg" class="draft-msg"></div><div id="draftSub" class="draft-sub"></div><div id="draftRoll" class="roll"></div><div id="draftResult"></div></div></div></section>

<section id="pro" class="screen">
 <div class="panel">
  <div class="tabs"><button id="careerTab" class="tab on" onclick="proTab('career')">시즌</button><button id="agencyTab" class="tab" onclick="proTab('agency')">에이전시</button></div>
 </div>
 <div id="careerPane" class="pane on">
  <div class="panel">
   <div class="season-head"><div><h2 id="proTitle"></h2><div class="chips"><div class="chip">나이 <b id="proAge"></b></div><div class="chip">소속 <b id="proClub"></b></div><div class="chip">역할 <b id="proLevel"></b></div></div></div><div class="chip">OVR <b id="proOvr"></b></div></div>
   <div id="proEvent" class="event-stage"></div>
   <div id="proRoad" class="month-road"></div>
  </div>
  <div class="data-grid">
   <div class="panel"><h3>시즌 누적 성적</h3><div id="proStats" class="stat-grid"></div><h3 style="margin-top:10px">능력치</h3><div id="proAttrs" class="attrs"></div></div>
   <div class="panel"><h3>팀/커리어</h3><div id="proInfo"></div><h3 style="margin-top:10px">최근 시즌</h3><div id="proHistory" class="log"></div></div>
  </div>
 </div>
 <div id="agencyPane" class="pane"><div class="panel"><h2>에이전시 연락</h2><div class="sub">원할 때만 사용합니다. 버튼을 누르지 않으면 아무 요청도 발생하지 않습니다.</div><div id="agencyContent" style="margin-top:10px"></div></div></div>
</section>
</div>
<div id="modal" class="modal"><div id="modalBody" class="modalbox"></div></div>

<script>
const $=id=>document.getElementById(id),pick=a=>a[Math.floor(Math.random()*a.length)],rand=(a,b)=>Math.random()*(b-a)+a,clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const POS={C:"포수","1B":"1루수","2B":"2루수","3B":"3루수",SS:"유격수",LF:"좌익수",CF:"중견수",RF:"우익수",DH:"지명타자"},ROLES={SP:"선발",RP:"중간계투",SU:"셋업",CL:"마무리"};
const H=["contact","power","discipline","speed","fielding","arm"],P=["velocity","stuff","control","command","breaking","stamina"];
const LAB={contact:"컨택",power:"파워",discipline:"선구안",speed:"주력",fielding:"수비",arm:"송구",velocity:"구속",stuff:"구위",control:"제구",command:"커맨드",breaking:"변화구",stamina:"체력"};
const TEAMS=[
["SEO","서울 타이탄즈","ST","#4169e1",84,90,70,"우승지향"],["BUS","부산 마리너스","BM","#00a2a2",72,78,78,"균형"],["INC","인천 웨이브","IW","#287fc6",67,74,83,"육성"],["DAE","대구 팔콘스","DF","#df6b35",74,71,73,"공격"],["DJN","대전 로켓츠","DR","#815bd3",62,67,88,"리빌딩"],["GWJ","광주 레드폭스","GR","#d74747",76,76,75,"승부사"],["SUW","수원 스톰","SS","#589f5a",68,69,80,"수비"],["CHW","창원 블레이즈","CB","#ef982a",70,72,74,"불펜"],["JEO","전주 피닉스","JP","#b64d99",59,63,90,"유망주"],["JEJ","제주 샤크스","JS","#188f75",63,65,84,"기동력"]
].map(x=>({id:x[0],name:x[1],abbr:x[2],c:x[3],power:x[4],budget:x[5],dev:x[6],style:x[7]}));
const team=id=>TEAMS.find(t=>t.id===id);
const MONTHS=["3월","4월","5월","6월","7월","8월","9월","10월"],PROMONTHS=["2월 캠프","3월 개막","4월","5월","6월","7월","8월","9월"];
let C={name:"김민준",type:"hitter",throws:"R",bats:"R",position:"SS",role:"SP",build:"balanced",fav:"SEO"},step=0,G=null,pending=null,recapPage=0;

function theme(id){let t=team(id);document.documentElement.style.setProperty("--team",t.c);$("logo").textContent=t.abbr}
function show(id){document.querySelectorAll(".screen").forEach(x=>x.classList.remove("on"));$(id).classList.add("on");window.scrollTo(0,0)}
function ovr(){let a=G.attrs;if(G.type==="hitter")return a.contact*.25+a.power*.2+a.discipline*.17+a.speed*.1+a.fielding*.18+a.arm*.1;return a.velocity*.15+a.stuff*.2+a.control*.19+a.command*.17+a.breaking*.17+a.stamina*.12}
function creator(){
 let s=[["선수","기본"],["역할","포지션"],["스타일","성장"],["희망팀","선호"],["확인","시작"]];
 $("steps").innerHTML=s.map((x,i)=>`<div class="step ${i===step?"on":""}">${i+1}. ${x[0]}</div>`).join("");$("nextBtn").textContent=step===4?"고교 커리어 시작":"다음";
 let b="";
 if(step===0){$("ctitle").textContent="선수 만들기";$("csub").textContent="같은 설정이어도 시작 능력과 잠재력은 매번 달라집니다.";b=`<input class="name" value="${C.name}" oninput="C.name=this.value"><div class="grid2" style="margin-top:8px">${card("type","hitter","야수","타격·수비 중심")}${card("type","pitcher","투수","구속·제구 중심")}</div><h3 style="margin-top:10px">투구</h3><div class="grid2">${card("throws","R","우투","")}${card("throws","L","좌투","")}</div><h3 style="margin-top:10px">타격</h3><div class="grid3">${card("bats","R","우타","")}${card("bats","L","좌타","")}${card("bats","S","스위치","")}</div>`}
 if(step===1){$("ctitle").textContent=C.type==="hitter"?"포지션":"투수 보직";$("csub").textContent="커리어 중 팀 상황에 따라 변경 제안이 올 수 있습니다.";b=`<div class="grid3">${Object.entries(C.type==="hitter"?POS:ROLES).map(([k,v])=>card(C.type==="hitter"?"position":"role",k,v,"")).join("")}</div>`}
 if(step===2){$("ctitle").textContent="성장 성향";$("csub").textContent="초기 능력치 보정만 결정합니다. 실제 성장은 사건에서의 선택으로 만들어집니다.";let a=C.type==="hitter"?[["balanced","균형형"],["contact","정교형"],["power","장타형"],["defense","수비형"]]:[["balanced","균형형"],["contact","제구형"],["power","파워형"],["defense","변화구형"]];b=`<div class="grid2">${a.map(x=>card("build",x[0],x[1],"")).join("")}</div>`}
 if(step===3){$("ctitle").textContent="응원하는 구단";$("csub").textContent="희망 구단과 실제 드래프트 결과는 다를 수 있습니다.";b=`<div class="team-grid">${TEAMS.map(t=>`<div class="team-card ${C.fav===t.id?"on":""}" onclick="C.fav='${t.id}';theme('${t.id}');creator()"><b>${t.name}</b><div class="tiny">${t.style} · 전력 ${t.power} · 육성 ${t.dev}</div></div>`).join("")}</div>`}
 if(step===4){$("ctitle").textContent="첫 시즌 준비";$("csub").textContent="고교 1학년부터 시작합니다. 매달 사건을 선택해야 다음 달로 진행됩니다.";b=`<div class="panel"><h2>${C.name}</h2><div class="chips"><div class="chip">${C.type==="hitter"?"야수":"투수"}</div><div class="chip">${C.type==="hitter"?POS[C.position]:ROLES[C.role]}</div><div class="chip">${team(C.fav).name} 팬</div></div></div>`}
 $("cbody").innerHTML=b
}
function card(k,v,t,d){return `<div class="choice ${C[k]===v?"on":""}" onclick="C.${k}='${v}';creator()"><b>${t}</b><small>${d}</small></div>`}
function prevStep(){if(step>0){step--;creator()}}function nextStep(){if(step<4){step++;creator()}else startCareer()}
function potential(){let r=Math.random();if(r<.06)return["세대급",rand(91,98),1.28];if(r<.25)return["특급",rand(84,92),1.16];if(r<.7)return["주전급",rand(73,85),1.02];return["원석형",rand(63,77),.9]}
function attrs(){let a=G?.type==="pitcher"?{velocity:62,stuff:58,control:52,command:50,breaking:56,stamina:63}:{contact:53,power:55,discipline:48,speed:64,fielding:60,arm:64};for(let k in a)a[k]+=rand(-6,6);return a}
function startCareer(){let pt=potential();G={...C,age:16,stage:"high",year:1,block:0,attrs:{},potTier:pt[0],potential:pt[1],learn:pt[2],work:rand(45,92),durability:rand(45,92),confidence:55,clutch:rand(40,95),scout:18,fame:8,trust:45,logs:[],history:[],honors:[],eventSeen:{},club:null,level:"아마추어",service:0,salary:3000,military:"미필",resolved:false,caps:0};G.attrs=attrsFor(G.type,G.build);theme(G.fav);snapAm();show("amateur");renderAm();newMonth()}
function attrsFor(type,build){let a=type==="pitcher"?{velocity:62,stuff:58,control:52,command:50,breaking:56,stamina:63}:{contact:53,power:55,discipline:48,speed:64,fielding:60,arm:64};for(let k in a)a[k]+=rand(-6,6);if(type==="hitter"){if(build==="contact"){a.contact+=4;a.discipline+=3}if(build==="power")a.power+=5;if(build==="defense"){a.fielding+=4;a.arm+=2}}else{if(build==="contact"){a.control+=4;a.command+=3}if(build==="power"){a.velocity+=5;a.stuff+=3}if(build==="defense")a.breaking+=5}for(let k in a)a[k]=clamp(a[k],38,78);return a}
function add(k,n){let before=G.attrs[k],gap=(G.potential||78)-before,f=(.65+gap/65)*(G.learn||1)*(G.age<=22?1.1:.9);G.attrs[k]=clamp(before+n*f,20,99);return G.attrs[k]-before}
function road(id,months){$(id).innerHTML=months.map((m,i)=>`<div class="month ${i<G.block?"done":i===G.block?"now":""}">${m}</div>`).join("")}
function renderAttrs(id){let keys=G.type==="hitter"?H:P;$(id).innerHTML=keys.map(k=>`<div class="attr"><div class="attr-top"><span>${LAB[k]}</span><b>${Math.round(G.attrs[k])}</b></div><div class="bar"><div class="fill" style="width:${G.attrs[k]}%"></div></div></div>`).join("")}

function resetSeasonTotals(){
  G.seasonTotals = G.type==="hitter"
    ? {months:0,pa:0,hits:0,ab:0,hr:0,sb:0,rbi:0,bb:0,tb:0}
    : {months:0,ip:0,er:0,k:0,bb:0,h:0,w:0,l:0};
}
function ensureSeasonTotals(){
  if(!G.seasonTotals)resetSeasonTotals();
}
function accumulateMonth(perf){
  ensureSeasonTotals();
  let t=G.seasonTotals;

function draftChance(origin){return clamp(.45+(ovr()-55)*.045+G.scout*.007+(G.potential-70)*.006+(origin==="college"?.1:0),.3,.985)}
function startDraft(origin){G.origin=origin;show("draft");$("draftResult").innerHTML="";$("draftRoll").innerHTML=TEAMS.map(t=>`<div class="roll-card" id="d${t.id}">${t.abbr}</div>`).join("");let order=[...TEAMS].sort(()=>Math.random()-.5),success=Math.random()<draftChance(origin),i=0;$("draftMsg").textContent="10개 구단의 최종 지명 회의";$("draftSub").textContent="한 팀씩 선택이 지나갑니다.";let tm=setInterval(()=>{document.querySelectorAll(".roll-card").forEach(x=>x.classList.remove("hot"));if(i<10){let t=order[i];$("d"+t.id).classList.add("hot");$("draftClock").textContent=10-i;$("draftMsg").textContent=`${t.name}, 지명 검토 중`;i++}else{clearInterval(tm);setTimeout(()=>draftEnd(success),500)}},380)}
function draftEnd(ok){if(!ok){$("draftClock").textContent="—";$("draftMsg").textContent="미지명";$("draftSub").textContent=G.origin==="high"?"대학에서 다시 도전할 수 있습니다.":"프로 테스트 기회가 남아 있습니다.";$("draftResult").innerHTML=`<button class="btn blue" style="width:100%" onclick="${G.origin==="high"?"goCollege()":"proTryout()"}">${G.origin==="high"?"대학 진학":"프로 테스트 도전"}</button>`;return}let t=pick(TEAMS);G.club=t.id;G.stage="pro";G.age=G.origin==="high"?18:22;G.level="2군";theme(t.id);$("draftClock").textContent="PICK";$("draftMsg").textContent=`${t.name} 지명!`;$("draftSub").textContent=G.fav===t.id?"희망 구단이 이름을 불렀습니다.":`${team(G.fav).name}을 원했지만 첫 팀은 ${t.name}입니다.`;$("draftResult").innerHTML=`<button class="btn green" style="width:100%" onclick="enterPro()">입단하기</button>`}
function proTryout(){let pass=Math.random()<clamp(.45+(ovr()-58)*.04,.3,.9);if(!pass){modal(`<h2>프로 테스트 불합격</h2><div class="sub">이번 도전은 여기서 끝났습니다.</div>`);return}G.club=pick(TEAMS).id;G.stage="pro";G.level="2군";enterPro()}
function enterPro(){show("pro");snapPro();renderPro();newMonth()}
function snapPro(){G.proStart={...G.attrs};G.proLogStart=G.logs.length;resetSeasonTotals();G.lastPerf=null;G.monthlyLines=[]}
function proSeasonLine(){return seasonTotalLine()}
function finishProSeason(){let s=proSeasonLine();G.history.push(`${G.age}세 · ${team(G.club).abbr} · ${G.level} · ${s.line}`);G.service++;G.trust=clamp(G.trust+(s.score-60)*.12,5,95);let v=ovr()*.7+G.trust*.2+s.score*.25+rand(-5,5);G.level=v>=78?"1군 주전":v>=69?"1군 백업":v>=61?"1군/2군":"2군";G.salary=Math.round((3000+Math.max(0,ovr()-55)*600+G.service*450+(G.level==="1군 주전"?4000:0))/100)*100;awardCheck(s);recapModal(`${G.age}세 시즌 결산`,s.line,seasonDelta(G.proStart),evals(false,s.score),"pro")}
function afterProRecap(){G.age++;G.block=0;proTab("career");snapPro();renderPro();newMonth()}
function awardCheck(s){if(G.type==="hitter"){if(G.service===1&&s.score>=78)addHonor("신인왕","첫 프로 시즌부터 강한 인상을 남겼습니다.",true);if(G.level==="1군 주전"&&G.attrs.fielding>=82&&Math.random()<.4)addHonor("골든글러브","수비와 시즌 성적을 인정받았습니다.",true);if(G.attrs.speed>=82&&Math.random()<.2)addHonor("도루왕","리그 최다 도루를 기록했습니다.",true);if(Math.random()<.04)addHonor("사이클링히트","한 경기에서 사이클링히트를 달성했습니다.",true)}else{if(G.service===1&&s.score>=78)addHonor("신인왕","첫 프로 시즌부터 강한 인상을 남겼습니다.",true);if(G.attrs.stamina>=80&&Math.random()<.12)addHonor("완봉승","9이닝 무실점 완봉승을 기록했습니다.",true);if(G.attrs.stuff>=87&&Math.random()<.025)addHonor("노히트노런","단 하나의 안타도 허용하지 않았습니다.",true)}if(Math.random()<.12)addHonor("시리즈 우승",`${team(G.club).name}과 정상에 올랐습니다.`,true)}
function addHonor(title,desc,major=false){G.honors.push({age:G.age,title,desc,major})}
function openRecords(){if(!G)return alert("커리어가 없습니다.");$("modalBody").innerHTML=`<h2>기록·수상</h2>${G.honors.length?G.honors.slice().reverse().map(h=>`<div class="honor ${h.major?"major":""}"><b>${h.age}세 · ${h.title}</b><div class="sub">${h.desc}</div></div>`).join(""):'<div class="sub">아직 특별 기록이 없습니다.</div>'}<button class="btn green" style="width:100%;margin-top:9px" onclick="closeModal()">돌아가기</button>`;$("modal").classList.add("on")}
function proTab(t){$("careerPane").classList.toggle("on",t==="career");$("agencyPane").classList.toggle("on",t==="agency");$("careerTab").classList.toggle("on",t==="career");$("agencyTab").classList.toggle("on",t==="agency")}
function renderAgency(){if(!G||!$("agencyContent"))return;$("agencyContent").innerHTML=`<div class="panel"><div class="chips"><div class="chip">소속 <b>${team(G.club).name}</b></div><div class="chip">역할 <b>${G.level}</b></div><div class="chip">연봉 <b>${G.salary.toLocaleString()}만</b></div></div></div><button class="btn blue" style="width:100%;margin-bottom:6px" onclick="agentTrade()">트레이드 가능성 상담</button><button class="btn dark" style="width:100%;margin-bottom:6px" onclick="agentRole()">출전 기회 상담</button><button class="btn dark" style="width:100%" onclick="agentFuture()">FA·계약 계획 상담</button>`}
function agentTrade(){modal(`<h2>트레이드 상담</h2><div class="sub">구단에 공식 요청할지, 시장 상황만 알아볼지 선택합니다.</div><button class="btn blue" style="width:100%;margin-top:8px" onclick="requestTrade()">공식 트레이드 요청</button><button class="btn dark" style="width:100%;margin-top:6px" onclick="closeModal()">상담만 하고 돌아간다</button>`)}
function requestTrade(){closeModal();let dest=TEAMS.filter(t=>t.id!==G.club).sort((a,b)=>b.dev-a.dev)[0];if(Math.random()<.55){G.club=dest.id;G.trust=48;theme(dest.id);alert(`${dest.name}으로 트레이드가 성사됐습니다.`)}else{G.trust-=2;alert("적절한 제안이 없어 트레이드가 성사되지 않았습니다.")}renderPro()}
function agentRole(){modal(`<h2>출전 기회 상담</h2><div class="sub">에이전트를 통해 역할 확대를 공식 요청할 수 있습니다.</div><button class="btn blue" style="width:100%;margin-top:8px" onclick="roleAsk()">역할 확대 요청</button><button class="btn dark" style="width:100%;margin-top:6px" onclick="closeModal()">평가만 듣고 돌아간다</button>`)}
function roleAsk(){closeModal();if(Math.random()<clamp(.3+G.trust*.006+ovr()*.004,.3,.85)){if(G.level==="2군")G.level="1군/2군";else if(G.level==="1군/2군")G.level="1군 백업";alert("구단이 더 많은 기회를 주기로 했습니다.")}else alert("구단은 당장 역할을 바꾸기 어렵다고 답했습니다.");renderPro()}
function agentFuture(){alert(`현재 서비스타임 ${G.service}년. FA까지 약 ${Math.max(0,7-G.service)}시즌이 남았습니다.`)}
function modal(x){$("modalBody").innerHTML=x;$("modal").classList.add("on")}function closeModal(){$("modal").classList.remove("on")}
function saveGame(){if(!G)return alert("커리어가 없습니다.");localStorage.setItem("diamondLife33",JSON.stringify(G));alert("저장했습니다. BUILD 33")}
function loadGame(){let s=localStorage.getItem("diamondLife33");if(!s)return alert("BUILD 33 저장 데이터가 없습니다.");G=JSON.parse(s);G.monthlyLines??=[];G.seasonTotals??=null;theme(G.club||G.fav);pending=null;if(G.stage==="high"||G.stage==="college"){show("amateur");renderAm();newMonth()}else{show("pro");renderPro();newMonth()}}
creator();
</script>
</body></html>
