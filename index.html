<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Diamond Life 17</title>
<style>
:root{
  --team:#3f6fff;--team2:#dbe6ff;--bg:#0e1116;--panel:#1a2028;--panel2:#232b35;
  --line:#394552;--text:#f7f9fc;--muted:#a9b3bf;--gold:#ffd65a;--good:#74df72;--bad:#ff7777
}
*{box-sizing:border-box}
html,body{margin:0;max-width:100%;overflow-x:hidden;background:var(--bg);color:var(--text)}
body{
  min-height:100vh;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  background-image:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);
  background-size:16px 16px
}
button,input{font:inherit}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.app{max-width:1160px;margin:auto;padding:12px}
.top{
  display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;margin-bottom:14px;
  background:#0a0d11;border:4px solid #000;box-shadow:0 0 0 3px var(--team),6px 6px 0 #000
}
.brand{display:flex;gap:10px;align-items:center}.badge{width:42px;height:42px;border:4px solid #000;background:var(--team);display:flex;align-items:center;justify-content:center;font-weight:900}
.brand h1{font-size:19px;margin:0}.brand small{display:block;color:var(--muted);font-size:10px;margin-top:2px}
.actions{display:flex;gap:6px}
.btn{border:3px solid #000;box-shadow:3px 3px 0 #000;background:var(--gold);color:#111;padding:9px 11px;font-weight:900;cursor:pointer}
.btn.green{background:var(--good)}.btn.blue{background:var(--team2)}.btn.dark{background:#2b3440;color:#fff}.btn.red{background:var(--bad)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #000}
.panel{background:var(--panel);border:4px solid #000;box-shadow:0 0 0 3px var(--line),6px 6px 0 #000;padding:14px;margin-bottom:14px}
h2,h3{margin:0 0 10px}.sub{color:var(--muted);font-size:12px;line-height:1.55}.tiny{color:var(--muted);font-size:10px}
.screen{display:none}.screen.active{display:block}
.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{border:3px solid #000;background:#10151b;padding:6px 8px;font-size:11px}.chip strong{color:var(--gold)}
.progress{height:10px;background:#080a0d;border:3px solid #000;margin:10px 0 14px}.progress>div{height:100%;background:var(--team)}
/* creator */
.creator-layout{display:grid;grid-template-columns:180px 1fr;gap:14px}
.steps{display:flex;flex-direction:column;gap:6px}.step{border:3px solid #000;background:#12171e;padding:8px;opacity:.55}.step.on{opacity:1;background:color-mix(in srgb,var(--team) 22%,#12171e)}
.step b{font-size:11px}.step span{display:block;color:var(--muted);font-size:9px;margin-top:3px}
.creator-nav{display:flex;justify-content:space-between;gap:8px;margin:0 0 12px}
.name{width:100%;padding:12px;border:4px solid #000;background:#0d1217;color:#fff;font-size:18px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.choice{border:4px solid #000;background:#12171e;padding:11px;cursor:pointer;min-height:90px}.choice.on{outline:3px solid var(--gold);background:color-mix(in srgb,var(--team) 25%,#12171e)}
.choice b{font-size:12px}.choice small{display:block;color:var(--muted);font-size:9px;margin-top:5px;line-height:1.4}.icon{font-size:25px;margin-bottom:6px}
.segments{display:flex;gap:7px;flex-wrap:wrap}.seg{border:3px solid #000;background:#12171e;color:#fff;padding:9px 12px;font-weight:900}.seg.on{background:var(--team);outline:2px solid var(--gold)}
.club-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
.club{border:3px solid #000;background:#12171e;padding:9px;cursor:pointer;min-width:0}.club.on{outline:3px solid var(--gold)}
.club-head{display:flex;gap:7px;align-items:center}.mini{width:30px;height:30px;border:3px solid #000;color:#fff;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:900;flex:0 0 30px}
.review{border:4px solid #000;background:#11161c;padding:12px}.review-row{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:2px solid #000;font-size:11px}
/* field-only pixel scenes */
.field{
  position:relative;height:275px;overflow:hidden;border:4px solid #000;background:linear-gradient(#75c3f1 0 36%,#d5efff 36% 40%,#367e49 40% 100%);
  box-shadow:5px 5px 0 #000
}
.stands{position:absolute;left:0;right:0;top:82px;height:54px;background:repeating-linear-gradient(90deg,#e96161 0 8px,#f0d261 8px 16px,#65a9e8 16px 24px,#eee 24px 32px);border-top:4px solid #000;border-bottom:4px solid #000}
.wall{position:absolute;left:0;right:0;top:136px;height:18px;background:#263b49;border-bottom:4px solid #000}
.grass{position:absolute;left:0;right:0;bottom:0;height:122px;background:repeating-linear-gradient(90deg,#3e9254 0 34px,#348248 34px 68px)}
.diamond{position:absolute;width:164px;height:164px;left:50%;bottom:-35px;transform:translateX(-50%) rotate(45deg);background:#c9955e;border:4px solid #000}
.base{position:absolute;width:11px;height:11px;background:#fff;border:3px solid #000;transform:rotate(45deg);z-index:6}
.home{left:calc(50% - 6px);bottom:16px}.first{left:calc(50% + 58px);bottom:68px}.second{left:calc(50% - 6px);bottom:122px}.third{left:calc(50% - 69px);bottom:68px}
.runner{position:absolute;width:9px;height:9px;background:var(--gold);border:3px solid #000;display:none;z-index:7}.runner.on{display:block}
.r1{left:calc(50% + 59px);bottom:84px}.r2{left:calc(50% - 5px);bottom:138px}.r3{left:calc(50% - 68px);bottom:84px}
.ball{position:absolute;width:9px;height:9px;background:#fff;border:2px solid #000;border-radius:50%;left:48%;bottom:43%;opacity:0;z-index:8}.ball.fly{animation:fly 1s steps(6,end)}
@keyframes fly{0%{opacity:1;transform:translate(0,0)}50%{opacity:1;transform:translate(60px,-60px)}100%{opacity:0;transform:translate(115px,-12px)}}
.board{position:absolute;left:10px;top:10px;z-index:9;background:#0b1115;border:4px solid #000;padding:8px 9px;box-shadow:4px 4px 0 rgba(0,0,0,.35)}
.board .green{color:#9bff88;font-size:10px}.board strong{display:block;font-size:18px;margin-top:3px}.banner{position:absolute;right:10px;top:10px;background:var(--team);border:4px solid #000;padding:7px 9px;font-size:10px;font-weight:900;z-index:9}
.auto{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;margin-top:10px}.status{border:3px solid #000;background:#11161d;padding:9px;font-size:11px;color:var(--muted)}
.dot{display:inline-block;width:9px;height:9px;border:2px solid #000;background:var(--bad);vertical-align:-1px;margin-right:6px}.dot.on{background:var(--good)}
/* stats */
.two{display:grid;grid-template-columns:1.1fr .9fr;gap:14px}.attrs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.attr{border:3px solid #000;background:#11161d;padding:7px}
.attr-head{display:flex;justify-content:space-between;font-size:10px}.bar{height:8px;background:#07090c;border:2px solid #000;margin-top:5px}.fill{height:100%;background:var(--team)}
.log{max-height:260px;overflow:auto}.log-item{border:3px solid #000;border-left:6px solid var(--team);background:#11161d;padding:8px;margin:6px 0;font-size:10px}
.table{width:100%;border-collapse:collapse;font-size:10px}.table td,.table th{padding:6px;border-bottom:2px solid #000;text-align:left}
/* draft */
.draft{position:relative;min-height:390px;border:4px solid #000;background:radial-gradient(circle at 50% 15%,#29364a,#0b0e13 58%);padding:16px;overflow:hidden}
.clock{width:96px;height:96px;border-radius:50%;border:6px solid var(--gold);display:flex;align-items:center;justify-content:center;margin:14px auto;background:#0d1217;box-shadow:0 0 0 5px #000;font-size:30px;font-weight:900}
.clock.pulse{animation:pulse .7s infinite}@keyframes pulse{50%{transform:scale(1.05);box-shadow:0 0 0 5px #000,0 0 28px var(--gold)}}
.roll{display:flex;gap:6px;overflow:hidden}.roll-card{min-width:80px;border:3px solid #000;background:#121820;padding:8px;text-align:center}.roll-card.hot{background:var(--team);outline:3px solid var(--gold)}
.draft-msg{text-align:center;font-size:19px;font-weight:900;margin:12px 0 5px}.draft-sub{text-align:center;color:var(--muted);font-size:10px;min-height:30px}
.result{border:4px solid #000;background:#11161d;padding:12px;margin-top:12px}
/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.78);display:none;align-items:center;justify-content:center;padding:16px;z-index:99}.modal.show{display:flex}.modal-box{width:min(680px,100%);max-height:88vh;overflow:auto;background:var(--panel);border:4px solid #000;box-shadow:0 0 0 4px var(--team),8px 8px 0 #000;padding:14px}
.offer{border:3px solid #000;background:#11161d;padding:10px;margin:8px 0}
@media(max-width:760px){
  .app{padding:9px}.creator-layout,.two{grid-template-columns:1fr}.steps{display:flex;flex-direction:row;overflow:hidden}.step{flex:1;padding:6px;text-align:center}.step span{display:none}
  .grid4{grid-template-columns:repeat(2,minmax(0,1fr))}.club-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .field{height:220px}.board,.banner{transform:scale(.82)}.board{transform-origin:top left}.banner{transform-origin:top right}
  .top .actions .btn{padding:6px;font-size:9px}.brand h1{font-size:16px}
}

/* Diamond Life 17 — mobile safety */
html,body{width:100%;max-width:100%;overflow-x:hidden}
img,svg,canvas{max-width:100%}
.panel,.two,.creator-layout,.grid2,.grid4,.club-grid,.attrs,.offer{min-width:0}
@media(max-width:760px){
  .app{width:100%;max-width:100%;padding:8px}
  .panel{width:100%;max-width:100%;padding:11px;margin-bottom:11px;overflow:hidden}
  .two{display:block}
  .creator-layout{display:block}
  .steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
  .step{min-width:0;padding:5px 3px}
  .step b{font-size:9px;white-space:normal;word-break:keep-all}
  .grid2,.grid4,.club-grid,.attrs{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
  .choice,.club,.attr{min-width:0}
  .club b,.choice b{word-break:keep-all}
  .field{height:205px;width:100%}
  .board{max-width:54%;transform:scale(.78);transform-origin:top left}
  .banner{max-width:42%;transform:scale(.78);transform-origin:top right}
  .modal{padding:8px;align-items:flex-end}
  .modal-box{
    width:100%;max-width:100%;max-height:82dvh;
    padding:12px 10px calc(14px + env(safe-area-inset-bottom));
    overflow-y:auto;overscroll-behavior:contain;
  }
  .modal-box .btn{width:100%;min-height:46px;margin-top:7px}
  .offer{display:block}
  .top{padding:8px}
  .brand h1{font-size:15px}
  .brand small{font-size:9px}
  .actions .btn{font-size:9px;padding:6px 7px}
  .auto{grid-template-columns:1fr;gap:6px}
  .auto .btn{width:100%}
  .chips{gap:5px}
  .chip{font-size:9px;padding:5px 6px}
}


.gain{color:var(--good)!important}.loss{color:var(--bad)!important}
.event-card{
  border:3px solid #000;border-left:7px solid var(--team);
  background:#11161d;padding:10px;margin-top:8px
}
.event-card b{display:block;margin-bottom:4px}
.event-card .effects{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.effect{border:2px solid #000;background:#0b1015;padding:4px 6px;font-size:9px}

</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><div id="topBadge" class="badge">DL</div><div><h1>DIAMOND LIFE 17</h1><small id="topSub">고교야구에서 시작되는 커리어</small></div></div>
    <div class="actions"><button class="btn dark" onclick="save()">저장</button><button class="btn dark" onclick="load()">불러오기</button></div>
  </header>

  <section id="creator" class="screen active">
    <div class="panel creator-layout">
      <div id="steps" class="steps"></div>
      <div>
        <h2 id="ctitle">선수 만들기</h2><div id="csub" class="sub"></div>
        <div class="progress"><div id="cprog"></div></div>
        <div class="creator-nav"><button id="prev" class="btn dark" onclick="prevStep()">이전</button><button id="next" class="btn green" onclick="nextStep()">다음</button></div>
        <div id="cbody"></div>
      </div>
    </div>
  </section>

  <section id="amateur" class="screen">
    <div class="two">
      <div>
        <div class="panel">
          <div class="chips"><div class="chip">단계 <strong id="amStage"></strong></div><div class="chip">나이 <strong id="amAge"></strong></div><div class="chip">스카우트 평가 <strong id="scout"></strong></div></div>
          <h2 id="amTitle" style="margin-top:12px"></h2>
          <div class="field" style="margin-top:10px">
            <div class="stands"></div><div class="wall"></div><div class="grass"></div><div class="diamond"></div>
            <div class="base home"></div><div class="base first"></div><div class="base second"></div><div class="base third"></div>
            <div id="ar1" class="runner r1"></div><div id="ar2" class="runner r2"></div><div id="ar3" class="runner r3"></div><div id="aball" class="ball"></div>
            <div class="board"><div class="green" id="amBoard"></div><strong id="amBoard2"></strong><div class="tiny" id="amBoard3"></div></div><div id="amBanner" class="banner"></div>
          </div>
          <div class="auto"><div class="status"><span id="amDot" class="dot"></span><span id="amStatus"></span></div><button class="btn blue" onclick="toggleAm()">일시정지</button></div>
        </div>
        <div class="panel">
  <h3>학교 소식</h3>
  <div id="amEvent" class="sub">시즌이 시작됩니다.</div>
  <div id="growthSummary" class="chips" style="margin-top:10px"></div>
</div>
      </div>
      <div>
        <div class="panel"><h3>선수 능력</h3><div id="amAttrs" class="attrs"></div></div>
        <div class="panel"><h3>커리어 기록</h3><div id="amLog" class="log"></div></div>
      </div>
    </div>
  </section>

  <section id="draft" class="screen">
    <div class="panel"><div class="draft">
      <div class="tiny" style="text-align:center;letter-spacing:3px">PRO BASEBALL ROOKIE DRAFT</div>
      <div id="clock" class="clock pulse">10</div>
      <div id="draftMsg" class="draft-msg">구단들이 최종 회의를 진행하고 있습니다</div><div id="draftSub" class="draft-sub"></div>
      <div id="roll" class="roll"></div><div id="draftResult"></div>
    </div></div>
  </section>

  <section id="pro" class="screen">
    <div class="two">
      <div>
        <div class="panel">
          <h2 id="pname"></h2><div id="meta" class="sub"></div>
          <div class="chips" style="margin-top:10px"><div class="chip">나이 <strong id="age"></strong></div><div class="chip">평가 <strong id="ovr"></strong></div><div class="chip">소속 <strong id="club"></strong></div><div class="chip">연봉 <strong id="salary"></strong></div></div>
        </div>
        <div class="panel">
          <h3>시즌 현장</h3>
          <div class="field">
            <div class="stands"></div><div class="wall"></div><div class="grass"></div><div class="diamond"></div>
            <div class="base home"></div><div class="base first"></div><div class="base second"></div><div class="base third"></div>
            <div id="pr1" class="runner r1"></div><div id="pr2" class="runner r2"></div><div id="pr3" class="runner r3"></div><div id="pball" class="ball"></div>
            <div class="board"><div class="green" id="pBoard"></div><strong id="pBoard2"></strong><div class="tiny" id="pBoard3"></div></div><div id="pBanner" class="banner"></div>
          </div>
          <div class="auto"><div class="status"><span id="pDot" class="dot"></span><span id="pStatus"></span></div><button class="btn blue" onclick="togglePro()">일시정지</button></div>
        </div>
        <div class="panel"><h3>라커룸 소식</h3><div id="proEvent" class="sub">시즌이 시작됩니다.</div></div>
        <div class="panel"><h3>리그 판도</h3><table class="table"><tbody id="standings"></tbody></table></div>
      </div>
      <div>
        <div class="panel"><h3>선수 능력</h3><div id="pAttrs" class="attrs"></div></div>
        <div class="panel"><h3>최근 기록</h3><div id="history" class="log"></div></div>
        <div class="panel"><h3>태극마크 / 병역</h3><div id="nat"></div></div>
      </div>
    </div>
  </section>
</div>

<div id="modal" class="modal"><div class="modal-box"><div id="modalBody"></div></div></div>

<script>
const $=id=>document.getElementById(id),pick=a=>a[Math.floor(Math.random()*a.length)],rand=(a,b)=>Math.random()*(b-a)+a,clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const POS={C:"포수","1B":"1루수","2B":"2루수","3B":"3루수",SS:"유격수",LF:"좌익수",CF:"중견수",RF:"우익수",DH:"지명타자"},ROLES={SP:"선발",RP:"중간계투",SU:"셋업",CL:"마무리"};
const H=["contact","power","discipline","speed","fielding","arm"],P=["velocity","stuff","control","command","breaking","stamina"],LAB={contact:"컨택",power:"파워",discipline:"선구안",speed:"주력",fielding:"수비",arm:"송구",velocity:"구속",stuff:"구위",control:"제구",command:"커맨드",breaking:"변화구",stamina:"체력"};
const TEAMS=[
["SEO","서울 타이탄즈","ST","#3f6fff","#dbe6ff",84,90,70],["BUS","부산 마리너스","BM","#0aa6a6","#d8ffff",72,78,78],["INC","인천 웨이브","IW","#267ec7","#d9efff",67,74,83],["DAE","대구 팔콘스","DF","#df6a32","#ffe4d7",74,71,73],["DJN","대전 로켓츠","DR","#7e59d6","#eadfff",62,67,88],["GWJ","광주 레드폭스","GR","#d74444","#ffe0e0",76,76,75],["SUW","수원 스톰","SS","#58a05a","#e0f2df",68,69,80],["CHW","창원 블레이즈","CB","#f59a28","#fff0d9",70,72,74],["JEO","전주 피닉스","JP","#b64b98","#f7dff2",59,63,90],["JEJ","제주 샤크스","JS","#168f75","#d7fff4",63,65,84]
].map(x=>({id:x[0],name:x[1],abbr:x[2],c1:x[3],c2:x[4],power:x[5],budget:x[6],dev:x[7]}));
const team=id=>TEAMS.find(t=>t.id===id),show=id=>{document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));$(id).classList.add("active")};
let C={name:"김민준",type:"hitter",throws:"R",bats:"R",position:"SS",role:"SP",build:"balanced",fav:"SEO"},step=0,G=null,amTimer=null,proTimer=null,amRun=false,proRun=false;
function theme(id){let t=team(id);document.documentElement.style.setProperty("--team",t.c1);document.documentElement.style.setProperty("--team2",t.c2);$("topBadge").textContent=t.abbr;$("topSub").textContent=t.name}
function ovr(){let a=G.attrs;if(G.type==="hitter")return a.contact*.25+a.power*.2+a.discipline*.17+a.speed*.1+a.fielding*.18+a.arm*.1;return a.velocity*.15+a.stuff*.2+a.control*.19+a.command*.17+a.breaking*.17+a.stamina*.12}
function creator(){
 let labels=[["선수","기본 정보"],["역할","포지션/보직"],["스타일","성장 방향"],["희망팀","마음속 구단"],["확인","첫 시즌 준비"]];
 $("steps").innerHTML=labels.map((x,i)=>`<div class="step ${i===step?"on":""}"><b>${i+1}. ${x[0]}</b><span>${x[1]}</span></div>`).join("");
 $("cprog").style.width=((step+1)*20)+"%";$("prev").style.visibility=step?"visible":"hidden";$("next").textContent=step===4?"고교 커리어 시작":"다음";
 let body="";
 if(step===0){$("ctitle").textContent="어떤 선수인가요?";$("csub").textContent="고교야구에서 시작할 모습을 정해보세요.";
 body=`<input class="name" value="${C.name}" oninput="C.name=this.value"><div class="grid2" style="margin-top:10px">
 ${card("type","hitter","⚾","야수","타격과 수비 중심의 커리어")}${card("type","pitcher","🔥","투수","구속·제구·보직 중심의 커리어")}</div>
 <div class="sub" style="margin:12px 0 6px">투구</div><div class="segments">${seg("throws","R","우투")}${seg("throws","L","좌투")}</div>
 <div class="sub" style="margin:12px 0 6px">타격</div><div class="segments">${seg("bats","R","우타")}${seg("bats","L","좌타")}${seg("bats","S","스위치")}</div>`}

        college?"투수코치의 집중 프로그램":"투수코치의 집중 프로그램",

function amStep(){
  if(!amRun)return;

  // Each block always creates a visible development event.
  runAmateurEvent(()=>{
    if(!amRun)return;
    G.block++;
    renderAm();

    if(G.block>=3){
      G.block=0;pauseAm();
      if(G.stage==="high"){
        if(G.year<3){
          G.year++;G.age++;
          G.logs.push(`${G.age}세 · 고교 ${G.year}학년 시즌을 준비합니다.`);
          renderAm();
          setTimeout(startAm,900);
        }else{
          decision("high");
        }
      }else{
        if(G.year<4){
          G.year++;G.age++;G.scout=clamp(G.scout+2,0,100);
          G.logs.push(`${G.age}세 · 대학 ${G.year}학년 시즌을 준비합니다.`);
          renderAm();
          setTimeout(startAm,900);
        }else{
          decision("college");
        }
      }
    }else{
      amTimer=setTimeout(amStep,1450);
    }
  });
}

  modal(`<h2>상무 최종 합격</h2><div class="sub">군 복무와 선수 생활을 함께 이어갑니다. 2시즌 동안 상무에서 뛰게 됩니다.</div><button class="btn green" onclick="closeM();enterSangmuSeason()">입대</button>`);
}
function enterSangmuSeason(){
  G.sangmuYears++;
  G.club=G.preSangmuClub; // theme remains original club colors for simplicity
  $("club").textContent="상무 야구단";
  G.block=0;newStandings();renderPro();setTimeout(startPro,600);
}
function finishSangmuIfNeeded(){
  if(G.stage!=="sangmu")return false;
  if(G.sangmuYears>=2){
    G.stage="pro";G.military="병역 완료";G.resolved=true;G.club=G.preSangmuClub;
    modal(`<h2>상무 전역</h2><div class="sub">${team(G.club).name}으로 복귀합니다. 병역을 마쳤습니다.</div><button class="btn green" onclick="closeM();newStandings();renderPro();setTimeout(startPro,650)">팀 복귀</button>`);
    return true;
  }else{
    G.sangmuYears++;
  }
  return false;
}
function playInternational(ev){
  closeM();
  G.caps++;
  let strength=ovr()+rand(-8,10)+G.trust*.08;
  let result=strength>78?"우승":strength>72?"준우승":strength>66?"4강":"예선 탈락";
  let militarySolved=false;
  if(!G.resolved){
    if(ev==="아시안게임" && result==="우승"){G.resolved=true;G.military="병역 해결";militarySolved=true}
    if(ev==="올림픽" && ["우승","준우승","4강"].includes(result) && strength>74){G.resolved=true;G.military="병역 해결";militarySolved=true}
  }
  modal(`<h2>${ev} ${result}</h2><div class="sub">대표팀 경력이 추가됐습니다.${militarySolved?" 병역 문제도 해결됐습니다.":""}</div><button class="btn green" onclick="closeM();renderPro();setTimeout(startPro,550)">소속팀 복귀</button>`);
}

function proEvent(){
  let r=Math.random();

  // Player-development choice event
  if(r<.22){
    pausePro();
    let choices=G.type==="hitter"?[
      ["타격 훈련",()=>{let a=addAttr("contact",.45),b=addAttr("discipline",.25);return [["컨택",a],["선구안",b]]}],
      ["장타 훈련",()=>{let a=addAttr("power",.5);return [["파워",a]]}],
      ["수비 훈련",()=>{let a=addAttr("fielding",.45),b=addAttr("arm",.25);return [["수비",a],["송구",b]]}]
    ]:[
      ["빠른 공",()=>{let a=addAttr("velocity",.4),b=addAttr("stuff",.35);return [["구속",a],["구위",b]]}],
      ["제구",()=>{let a=addAttr("control",.45),b=addAttr("command",.35);return [["제구",a],["커맨드",b]]}],
      ["변화구",()=>{let a=addAttr("breaking",.5);return [["변화구",a]]}]
    ];
    window._proChoices=choices;
    modal(`<h2>이번 달 개인 훈련</h2><div class="sub">현재 역할과 시즌 상황을 고려해 집중 훈련을 선택합니다.</div>${choices.map((c,i)=>`<button class="btn ${i===0?"green":"blue"}" onclick="proChoicePick(${i})">${c[0]}</button>`).join("")}`);
    return;
  }

  // Military / Sangmu
  if(r<.36 && G.age>=22 && G.age<=28 && !G.resolved && G.military==="미필"){
    pausePro();
    modal(`<h2>병역 계획</h2><div class="sub">선수 생활을 이어가면서 병역 문제를 해결할 시점이 다가왔습니다.</div>
      <button class="btn green" onclick="applySangmu()">상무 지원</button>
      <button class="btn blue" onclick="closeM();setTimeout(startPro,500)">대표팀 기회를 기다린다</button>`);
    return;
  }

  // International tournament
  if(r<.52 && G.age>=20 && G.age<=34 && Math.random()<.48){
    pausePro();
    let events=["아시안게임","WBC","프리미어12","올림픽"];
    let ev=pick(events);
    modal(`<h2>대한민국 대표팀</h2><div class="sub">${ev} 대표팀 후보 명단에 포함됐습니다.</div>
      <button class="btn green" onclick="playInternational('${ev}')">대표팀 합류</button>
      <button class="btn dark" onclick="closeM();setTimeout(startPro,500)">이번에는 고사</button>`);
    return;
  }

  let msg="";
  if(r<.66){G.trust=clamp(G.trust+2,0,100);msg="감독이 최근 경기 태도와 준비 과정을 긍정적으로 평가했습니다."}
  else if(r<.79){msg="팀 내 주전 경쟁이 다시 치열해졌습니다. 다음 몇 주의 활약이 중요합니다."}
  else if(r<.9){G.pref[G.club]=clamp((G.pref[G.club]||50)+3,0,100);msg="지역 팬 행사에 참가하며 소속팀과의 유대가 깊어졌습니다."}
  else{msg="언론이 최근 활약을 집중 조명하면서 리그 내 인지도가 높아졌습니다."}
  $("proEvent").innerHTML=`<div class="event-card"><b>${msg}</b></div>`;
}
function proStep(){
 if(!proRun)return;G.block++;if(Math.random()<.55)proEvent();renderPro();
 if(!proRun)return;
 if(G.block>=5){pausePro();finishSeason();return}
 proTimer=setTimeout(proStep,1350)
}
function finishSeason(){
  let a=G.attrs,summary;
  if(G.type==="hitter"){
    let avg=clamp(.235+(a.contact-55)*.002+rand(-.02,.02),.19,.36);
    let ops=avg+.35+(a.power-55)*.005+(a.discipline-55)*.001+rand(-.04,.04);
    summary=`${G.age}세 · ${G.stage==="sangmu"?"상무":team(G.club).abbr} · OPS ${ops.toFixed(3)} · ${Math.max(1,Math.round(8+(a.power-55)*.75+rand(-4,5)))} HR`;
  }else{
    let era=clamp(5.2-(a.stuff-55)*.045-(a.control-55)*.025+rand(-.45,.45),1.8,6.7);
    summary=`${G.age}세 · ${G.stage==="sangmu"?"상무":team(G.club).abbr} · ERA ${era.toFixed(2)}`;
  }
  G.history.push(summary);

  if(G.stage!=="sangmu"){
    G.service++;
    G.salary=Math.round((3000+Math.max(0,ovr()-60)*600+G.service*450)/100)*100;
  }else{
    // Sangmu seasons emphasize development
    let keys=G.type==="hitter"?H:P;
    addAttr(pick(keys),.4);addAttr(pick(keys),.35);
  }

  G.age++;G.block=0;newStandings();

  if(G.stage==="sangmu"){
    if(finishSangmuIfNeeded())return;
    renderPro();setTimeout(startPro,850);return;
  }

  if(G.service>=7&&((G.service-7)%4===0)){fa();return}
  renderPro();setTimeout(startPro,900);
}
function fa(){
 let offers=[...TEAMS].map(t=>({t,score:t.budget*.3+t.power*.2+(G.pref[t.id]||50)*.25+rand(-10,10),money:Math.round((1.5+ovr()/50+t.budget/100)*10000/100)*100})).sort((a,b)=>b.score-a.score).slice(0,4);
 modal(`<h2>FA 시장</h2><div class="sub">여러 구단이 서로 다른 조건으로 손을 내밀었습니다.</div>${offers.map(o=>`<div class="offer"><b>${o.t.name}</b><div class="tiny">팀 전력 ${o.t.power} · 선호도 ${G.pref[o.t.id]}</div><div style="color:var(--gold);margin:5px 0">연 ${o.money.toLocaleString()}만</div><button class="btn blue" onclick="sign('${o.t.id}',${o.money})">계약</button></div>`).join("")}`)
}
function sign(id,m){G.club=id;G.salary=m;G.trust=55;theme(id);closeM();newStandings();renderPro();setTimeout(startPro,700)}
function save(){if(!G)return alert("진행 중인 커리어가 없습니다.");localStorage.setItem("diamondLife17",JSON.stringify(G));alert("저장했습니다.")}
function load(){let s=localStorage.getItem("diamondLife17")||localStorage.getItem("diamondLife16");if(!s)return alert("저장된 커리어가 없습니다.");G=JSON.parse(s);theme(G.club||G.fav);if(G.stage==="high"||G.stage==="college"){show("amateur");renderAm();setTimeout(startAm,500)}else{show("pro");newStandings();renderPro();setTimeout(startPro,500)}}
creator();
</script>
</body>
</html>
